name: Beta checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website-webkit:
    name: Website / WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:web
      - run: npx playwright install --with-deps webkit
      - name: Test the built website in WebKit
        run: npm run test:web:webkit
        env:
          TEST_OUTPUT: test-output/webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-webkit-evidence
          path: |
            test-output/webkit/*.png
            test-output/webkit/*.zip
          if-no-files-found: ignore
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: built-runtime
          path: |
            app.js
            syntax-worker.js
            THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Test the built website, including save and reopen
        run: npm run test:web
        env:
          TEST_OUTPUT: test-output/web
      - name: Upload the verified static website
        uses: actions/upload-artifact@v4
        with:
          name: comparecode-website
          path: dist/client/
          if-no-files-found: error
      - name: Test the installed extension, including save and reopen
        run: npm run test:browser
        env:
          REQUIRE_EXTENSION: '1'
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: code-compare-local-beta
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-screenshots
          path: test-output/**/*.png
          if-no-files-found: ignore
