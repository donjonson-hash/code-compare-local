name: Beta checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Test the installed extension, including save and reopen
        run: npm run test:browser
        env:
          REQUIRE_EXTENSION: '1'
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: code-compare-local-beta
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-check-failure
          path: test-output/*.png
          if-no-files-found: ignore
